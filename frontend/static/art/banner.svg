<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Resume and target illustration"><title>Resume and target illustration</title><style>
.ink { stroke: #1E1B3A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.thin { stroke: #1E1B3A; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.v { transform-box: view-box; }
@media (prefers-reduced-motion: no-preference) {
  .bob { animation: bob 2.6s ease-in-out infinite; }
  .shadow { animation: shadow 2.6s ease-in-out infinite; transform-origin: 120px 246px; }
  .eyes { animation: blink 4.2s infinite; transform-origin: 120px 98px; }
  .wave { animation: wave 1.1s ease-in-out infinite alternate; transform-origin: 178px 132px; }
  .tw { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .tw2 { animation: twinkle 1.8s ease-in-out .6s infinite; transform-box: fill-box; transform-origin: center; }
  .tw3 { animation: twinkle 1.8s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
  .jump { animation: jump 1s cubic-bezier(.3,.0,.3,1) infinite; }
  .cheerL { animation: cheerL .5s ease-in-out infinite alternate; transform-origin: 62px 132px; }
  .cheerR { animation: cheerR .5s ease-in-out infinite alternate; transform-origin: 178px 132px; }
  .dot1 { animation: dot 1.5s ease-in-out infinite; }
  .dot2 { animation: dot 1.5s ease-in-out .25s infinite; }
  .dot3 { animation: dot 1.5s ease-in-out .5s infinite; }
  .drop { animation: drop 1.6s ease-in infinite; }
  .shiver { animation: shiver .18s linear infinite alternate; transform-origin: 120px 200px; }
  .stroke { stroke-dasharray: 60; animation: swipe 2.2s ease-in-out infinite; }
  .look { animation: look 3.4s ease-in-out infinite; }
  .conf { animation: fall 1.6s linear infinite; }
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes shadow { 0%,100% { transform: scaleX(1); opacity:.18; } 50% { transform: scaleX(.86); opacity:.12; } }
@keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
@keyframes wave { from { transform: rotate(-12deg); } to { transform: rotate(22deg); } }
@keyframes twinkle { 0%,100% { transform: scale(.6) rotate(0deg); opacity:.5; } 50% { transform: scale(1.1) rotate(20deg); opacity:1; } }
@keyframes jump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-22px); } 60% { transform: translateY(-22px); } }
@keyframes cheerL { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
@keyframes cheerR { from { transform: rotate(8deg); } to { transform: rotate(-10deg); } }
@keyframes dot { 0%,100% { opacity:.15; transform: translateY(0); } 40% { opacity:1; transform: translateY(-5px); } }
@keyframes drop { 0% { transform: translateY(-6px); opacity:0; } 20% { opacity:1; } 100% { transform: translateY(16px); opacity:0; } }
@keyframes shiver { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
@keyframes swipe { 0% { stroke-dashoffset: 60; } 45%,80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -60; } }
@keyframes look { 0%,40%,100% { transform: translate(0,0); } 50%,90% { transform: translate(4px,-3px); } }
@keyframes fall { from { transform: translateY(-30px) rotate(0); } to { transform: translateY(260px) rotate(320deg); } }
@media (prefers-reduced-motion: no-preference){.doc{animation:bob 4s ease-in-out infinite}.arrow{animation:hit 3.2s cubic-bezier(.3,.7,.2,1) infinite}.ring{animation:pulse 3.2s ease-out infinite;transform-origin:118px 112px}}@keyframes hit{0%{transform:translate(40px,-34px);opacity:0}25%{opacity:1}40%,100%{transform:translate(0,0);opacity:1}}@keyframes pulse{0%,38%{transform:scale(1);opacity:0}42%{opacity:.6}70%,100%{transform:scale(1.35);opacity:0}}</style><path d="M30 150 Q20 90 70 70 Q120 40 150 80 Q190 130 150 165 Q90 200 30 150 Z" fill="#C7DBFF" opacity=".55"/><circle cx="118" cy="112" r="50" fill="#2563EB"/><circle cx="118" cy="112" r="37" fill="#fff"/><circle cx="118" cy="112" r="25" fill="#2563EB"/><circle cx="118" cy="112" r="12" fill="#fff"/><circle cx="118" cy="112" r="5" fill="#1E40AF"/><circle class="ring" cx="118" cy="112" r="50" fill="none" stroke="#2563EB" stroke-width="3"/><g class="doc"><rect x="168" y="22" width="112" height="140" rx="14" fill="#fff" stroke="#DBEAFE" stroke-width="3"/><circle cx="196" cy="54" r="14" fill="#DBEAFE"/><circle cx="196" cy="50" r="5" fill="#2563EB"/><path d="M187 63 Q196 55 205 63" fill="#2563EB"/><rect x="218" y="44" width="46" height="7" rx="3.5" fill="#2563EB"/><rect x="218" y="58" width="32" height="6" rx="3" fill="#BFD3F8"/><rect x="184" y="84" width="80" height="6" rx="3" fill="#D6E2F8"/><rect x="184" y="98" width="68" height="6" rx="3" fill="#D6E2F8"/><rect x="184" y="112" width="74" height="6" rx="3" fill="#FFD23F" opacity=".9"/><rect x="184" y="126" width="56" height="6" rx="3" fill="#D6E2F8"/><circle cx="270" cy="150" r="15" fill="#22C55E"/><path d="M263 150 L268 155 L278 144" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="arrow"><path d="M118 112 L164 66" stroke="#0F1B3D" stroke-width="6" stroke-linecap="round"/><path d="M160 58 L176 54 L172 70 Z" fill="#FFD23F" stroke="#0F1B3D" stroke-width="3" stroke-linejoin="round"/><path d="M156 62 L172 58" stroke="#0F1B3D" stroke-width="3" stroke-linecap="round"/></g><path class="tw" d="M58,31 Q59.62,38.38 67,40 Q59.62,41.62 58,49 Q56.38,41.62 49,40 Q56.38,38.38 58,31 Z" fill="#FFD23F" stroke="#1E1B3A" stroke-width="3" stroke-linejoin="round"/><path class="tw2" d="M296,11 Q297.26,16.74 303,18 Q297.26,19.26 296,25 Q294.74,19.26 289,18 Q294.74,16.74 296,11 Z" fill="#2563EB" stroke="#1E1B3A" stroke-width="3" stroke-linejoin="round"/><path class="tw3" d="M40,114 Q41.08,118.92 46,120 Q41.08,121.08 40,126 Q38.92,121.08 34,120 Q38.92,118.92 40,114 Z" fill="#93B4F5" stroke="#1E1B3A" stroke-width="3" stroke-linejoin="round"/></svg>